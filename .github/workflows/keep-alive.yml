name: Keep Supabase awake

# Supabase pauses free projects after about a week without activity, which takes the live site's data offline.
# A tiny read twice a week counts as activity. It uses only the public publishable key; row-level security
# means the query returns nothing, but it still reaches the database.
on:
  schedule:
    - cron: '17 9 * * 1,4'   # Mondays and Thursdays, 09:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/trees?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase responded $code"
          test "$code" = 200
